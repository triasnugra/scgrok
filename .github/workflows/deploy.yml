name: Deploy halaman dan jurnal
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Jurnal scalp
        run: node scripts/scan.mjs
        continue-on-error: true
        env:
          USE_AI: ${{ vars.USE_AI }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      - name: Cek rantai hash
        run: node scripts/forward.mjs verify
        continue-on-error: true
      - name: Laporan forward
        run: node scripts/forward.mjs report
        continue-on-error: true
      - name: Simpan jurnal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/
          if git diff --staged --quiet; then echo "tidak ada perubahan"; exit 0; fi
          git commit -m "chore: jurnal scalp [skip ci]"
          git push || (git pull --rebase && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
